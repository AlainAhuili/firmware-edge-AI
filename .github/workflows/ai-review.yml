# Advisory AI review by Dev Growth Copilot (github.com/AlainAhuili/dev-growth-copilot).
#
#   review  (contents: read, has the API key)   -> findings.json + comment.md artifact
#   comment (pull-requests: write, no key, no PR code) -> one PR comment, updated in place
#
# The review never blocks a merge. The only failing check is the deterministic
# prompt-injection guard (text in the diff addressed to an AI reviewer).
# Same-repo PRs only: fork PRs get no secrets and no comment.
#
# Settings needed in this repo:
#   secret   ANTHROPIC_API_KEY  (without it the job is skipped with a notice)
#   variable COPILOT_REF        reviewer version to use: a commit SHA or tag of
#                               dev-growth-copilot (default: main). Pin it.
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    outputs:
      reviewed: ${{ steps.run.outputs.reviewed }}
    steps:
      - name: Check secret
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not set in this repo, skipping AI review"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # The PR's code is checked out only to compute the diff. Nothing from it is run.
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: pr
          persist-credentials: false

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          repository: AlainAhuili/dev-growth-copilot
          ref: ${{ vars.COPILOT_REF || 'main' }}
          path: copilot
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.13"

      # Editable, so the reviewer finds its agents/ configs and prompts in the checkout.
      - name: Install reviewer
        if: steps.key.outputs.present == 'true'
        run: pip install -e "./copilot[agent]"

      - name: Diff of this PR
        if: steps.key.outputs.present == 'true'
        working-directory: pr
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --no-color "origin/$BASE_REF" HEAD > "$RUNNER_TEMP/pr.diff"
          echo "diff: $(wc -l < "$RUNNER_TEMP/pr.diff") lines"

      # -I: isolated mode. The working directory is not on sys.path, so files in the PR
      # (e.g. a planted reviewer/ or evals/ package) can't replace the reviewer's modules.
      - name: Review
        id: run
        if: steps.key.outputs.present == 'true'
        working-directory: ${{ runner.temp }}
        env:
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p review
          python -I -m reviewer.cli --diff pr.diff --repo "$REPO" --sha "$SHA" \
            --out review/findings.json --comment review/comment.md
          echo "reviewed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.run.outputs.reviewed == 'true'
        with:
          name: review-findings
          path: ${{ runner.temp }}/review/
          retention-days: 90

  comment:
    needs: review
    if: needs.review.outputs.reviewed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: review-findings
          path: review

      - name: Post or update the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- dev-growth-copilot-review -->'
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\")
                            | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@review/comment.md >/dev/null
            echo "updated comment $id"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@review/comment.md >/dev/null
            echo "posted new comment"
          fi

      # The one deterministic gate: text in the diff that gives instructions to an AI.
      - name: Injection guard
        run: |
          n=$(jq '[.findings[] | select(.category == "injection" and .source == "deterministic")] | length' review/findings.json)
          if [ "$n" -gt 0 ]; then
            jq -r '.findings[] | select(.category == "injection" and .source == "deterministic")
                   | "::error file=\(.file | gsub("[^A-Za-z0-9._/-]"; "_")),line=\(.line)::text addressed to an AI reviewer"' \
               review/findings.json
            exit 1
          fi
          echo "no injection attempts"
