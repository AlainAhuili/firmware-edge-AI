# Advisory AI review by Dev Growth Copilot (github.com/AlainAhuili/dev-growth-copilot).
#
#   guard   (contents: read, no key, no model)  deterministic injection check, the only gate
#   review  (after guard; the key reaches only the review step) -> findings + comment
#   comment (pull-requests: write, no key, no PR code)  one PR comment, updated in place
#
# The guard runs on every PR and doesn't depend on the AI review: a missing key, a model
# error or a fork PR can't switch it off. The review never blocks a merge.
#
# Settings needed in this repo:
#   secret   ANTHROPIC_API_KEY  (without it the review is skipped with a notice)
#   variable COPILOT_REF        full 40-character commit SHA of dev-growth-copilot.
#                               Required by both jobs that run its code; a branch or tag
#                               could move. If it's missing or invalid, the guard fails
#                               (fails closed) and says why.
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

defaults:
  run:
    shell: bash  # -eo pipefail

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: injection guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check reviewer pin
        id: ref
        env:
          COPILOT_REF: ${{ vars.COPILOT_REF }}
        run: |
          if [[ ! "$COPILOT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Set the repository variable COPILOT_REF to a full 40-character commit SHA of dev-growth-copilot (got '${COPILOT_REF}'). Branches and tags can move."
            exit 1
          fi
          echo "sha=$COPILOT_REF" >> "$GITHUB_OUTPUT"

      # The PR's code is checked out only to compute the diff. Nothing from it is run.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: pr
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: AlainAhuili/dev-growth-copilot
          ref: ${{ steps.ref.outputs.sha }}
          path: copilot
          persist-credentials: false

      - name: Diff of this PR
        working-directory: pr
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --no-color "origin/$BASE_REF" HEAD > "$RUNNER_TEMP/pr.diff"

      # The guard is standard-library only, so it runs as a script: no install, no key,
      # no model. -I keeps the working directory and environment out of the import path.
      - name: Injection guard
        working-directory: ${{ runner.temp }}
        env:
          GUARD: ${{ github.workspace }}/copilot/tools/injection_guard.py
        run: python3 -I "$GUARD" pr.diff

  # Runs only after the guard passed: a diff with an injection attempt never reaches the
  # model or the job that holds the key.
  review:
    needs: guard
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      reviewed: ${{ steps.run.outputs.reviewed }}
    steps:
      # Only a true/false reaches this step, never the key itself.
      - name: Check secret
        id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::ANTHROPIC_API_KEY not set in this repo, skipping AI review"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check reviewer pin
        id: ref
        if: steps.key.outputs.present == 'true'
        env:
          COPILOT_REF: ${{ vars.COPILOT_REF }}
        run: |
          if [[ ! "$COPILOT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Set the repository variable COPILOT_REF to a full 40-character commit SHA of dev-growth-copilot (got '${COPILOT_REF}')."
            exit 1
          fi
          echo "sha=$COPILOT_REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.key.outputs.present == 'true'
        with:
          path: pr
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.key.outputs.present == 'true'
        with:
          repository: AlainAhuili/dev-growth-copilot
          ref: ${{ steps.ref.outputs.sha }}
          path: copilot
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.13"

      # Runs package build code from PyPI, so the key is deliberately not in reach here.
      # Editable, so the reviewer finds its agents/ configs and prompts in the checkout.
      - name: Install reviewer
        if: steps.key.outputs.present == 'true'
        run: pip install -e "./copilot[agent]"

      - name: Diff of this PR
        if: steps.key.outputs.present == 'true'
        working-directory: pr
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --no-color "origin/$BASE_REF" HEAD > "$RUNNER_TEMP/pr.diff"
          echo "diff: $(wc -l < "$RUNNER_TEMP/pr.diff") lines"

      # The only step with the key. -I: the working directory is not on sys.path, so
      # files in the PR (e.g. a planted reviewer/ package) can't replace the reviewer.
      - name: Review
        id: run
        if: steps.key.outputs.present == 'true'
        working-directory: ${{ runner.temp }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p review
          python -I -m reviewer.cli --diff pr.diff --repo "$REPO" --sha "$SHA" \
            --out review/findings.json --comment review/comment.md
          echo "reviewed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.run.outputs.reviewed == 'true'
        with:
          name: review-findings
          path: ${{ runner.temp }}/review/
          retention-days: 90

  comment:
    needs: review
    if: needs.review.outputs.reviewed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: review-findings
          path: review

      - name: Post or update the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- dev-growth-copilot-review -->'
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                  --jq ".[] | select(.user.login == \"github-actions[bot]\")
                             | select(.body | startswith(\"$marker\")) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@review/comment.md >/dev/null
            echo "updated comment $id"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@review/comment.md >/dev/null
            echo "posted new comment"
          fi
