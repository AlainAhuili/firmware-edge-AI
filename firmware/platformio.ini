; PlatformIO project for the ESP32-S3 firmware.
; Build:   pio run -d firmware
; Flash:   pio run -d firmware -t upload        (board on the USB-C port labelled UART/COM)
; Monitor: pio device monitor -d firmware
;
; Board: ESP32-S3-DevKitC-1 with the N16R8 module (16 MB quad-SPI flash,
; 8 MB octal PSRAM). "qio_opi" tells the toolchain the PSRAM is octal; with the
; wrong memory type the board boot-loops or reports 0 MB PSRAM.

[platformio]
default_envs = esp32s3-n16r8

[env:esp32s3-n16r8]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; The base board definition is the N8 variant (8 MB flash, no PSRAM); these
; lines override it for the N16R8 module.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -Wall
    -Wextra

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
