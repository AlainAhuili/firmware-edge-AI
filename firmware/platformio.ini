; Firmware for ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM).
; Logic lives in lib/ so it can be unit-tested on the host (env:native) in the
; commit stage without hardware. src/ is only the thin hardware layer.

[platformio]
default_envs = esp32-s3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:esp32-s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
check_tool = cppcheck
check_flags = cppcheck: --enable=warning,performance,portability --inline-suppr
check_skip_packages = yes

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
